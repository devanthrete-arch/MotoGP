name: Refresh Pitstop videos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitstop-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover videos and refresh catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/discover-pitstop.mjs
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- public/pitstop-videos.json; then
            echo "Pitstop catalog is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pitstop-videos.json
          git commit -m "chore: refresh Pitstop video catalog"
          git push origin HEAD:master
