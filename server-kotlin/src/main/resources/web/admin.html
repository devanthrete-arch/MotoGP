<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autoflex moderation</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Autoflex home">
        <span>Auto</span><strong>flex</strong>
      </a>
      <a class="secondary link-button" href="/">Back to app</a>
    </header>

    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Moderation</p>
        <h1>Reports and road-test feedback.</h1>
        <p class="muted">Use the admin token to inspect community reports and early user feedback. Service-center work stays separate.</p>
      </section>

      <form id="admin-form" class="toolbar admin-toolbar">
        <label>
          Admin token
          <input id="admin-token" type="password" placeholder="Enter token">
        </label>
        <button class="primary" type="submit">Load admin inbox</button>
      </form>

      <h2>Road-test feedback</h2>
      <div id="feedback" class="feed" aria-live="polite"></div>
      <h2>Client errors</h2>
      <div id="client-errors" class="feed" aria-live="polite"></div>
      <h2>Reported posts</h2>
      <div id="reports" class="feed" aria-live="polite"></div>
      <button id="load-more-reports" class="secondary wide hidden" type="button">Load more</button>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="/assets/admin.js" defer></script>
  </body>
</html>
