<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autoflex — The Car Enthusiast's Blog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#/" id="home-link">
        <span class="logo">◈</span> Auto<span class="accent">flex</span>
      </a>
      <div class="search">
        <input id="search" type="search" placeholder="Search posts, brands, authors…" />
      </div>
      <button class="btn primary" id="new-post-btn">+ Write a Post</button>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="wrap">
      <h1>Where car people <span class="accent">think out loud.</span></h1>
      <p>Full ownership. Zero gatekeeping. Write about how your car works, what to fix, what to buy, and what just launched.</p>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <main class="wrap layout">
    <aside class="sidebar">
      <div class="filter-group">
        <h3>Sort</h3>
        <div class="chips" id="sort-chips">
          <button class="chip active" data-sort="latest">Latest</button>
          <button class="chip" data-sort="popular">Popular</button>
        </div>
      </div>
      <div class="filter-group">
        <h3>Topic</h3>
        <div class="chips" id="topic-chips"></div>
      </div>
      <div class="filter-group">
        <h3>Brand</h3>
        <div class="chips" id="brand-chips"></div>
      </div>
    </aside>

    <section class="content" id="view"></section>
  </main>

  <!-- Editor modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">Write a Post</h2>
        <button class="icon-btn" id="modal-close">✕</button>
      </div>
      <form id="post-form">
        <input type="hidden" id="f-id" />
        <label>Title<input id="f-title" maxlength="200" required placeholder="e.g. Why my Nexon's turbo lag disappeared after this tweak" /></label>
        <div class="row">
          <label>Your name<input id="f-author" maxlength="60" placeholder="Anonymous" /></label>
          <label>Brand<select id="f-brand"></select></label>
          <label>Topic<select id="f-topic"></select></label>
        </div>
        <label>Cover image URL (optional)<input id="f-cover" maxlength="2000" placeholder="https://…" /></label>
        <label>Body <span class="hint">— Markdown-lite: **bold**, *italic*, # heading, - list, blank line = paragraph</span>
          <textarea id="f-body" rows="12" required placeholder="Write freely…"></textarea>
        </label>
        <div class="modal-actions">
          <span class="err" id="form-err"></span>
          <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn primary" id="submit-btn">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <footer class="footer"><div class="wrap">Autoflex · built for New Age car enthusiasts · your words, your ownership</div></footer>

  <script src="js/app.js"></script>
</body>
</html>
